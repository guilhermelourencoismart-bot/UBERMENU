name: MSBuild

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  msbuild:
    runs-on: windows-2022
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, ReleaseAVX2, ReleaseTextmode, ReleaseTextmodeAVX2]
        platform: [x64]

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Validate project file references
      run: python scripts/validate_unibox.py

    - name: Test validation failure paths
      run: python -m unittest discover -s tests -p "test_*.py" -v

    - name: Add NuGet to PATH
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: '6.12.1'

    - name: Restore NuGet packages
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: nuget restore Unibox.sln -ConfigFile NuGet.config -NonInteractive

    - name: Validate restored dependencies
      run: python scripts/validate_unibox.py --require-packages

    - name: Run native calculation tests with MSVC x64
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installation = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (!$installation) { throw 'VS2022 C++ x64 tools not found' }
        $testScript = Join-Path $env:RUNNER_TEMP 'unibox-native-tests.cmd'
        @"
        @echo off
        call "$installation\VC\Auxiliary\Build\vcvars64.bat"
        if errorlevel 1 exit /b 1
        cl /nologo /EHsc /std:c++20 tests\radar_math_tests.cpp /Fe:radar_math_tests.exe
        if errorlevel 1 exit /b 1
        radar_math_tests.exe
        if errorlevel 1 exit /b 1
        cl /nologo /EHsc /utf-8 /std:c++20 /Ipackages\boost.1.87.0\lib\native\include tests\config_codec_tests.cpp /Fe:config_codec_tests.exe
        if errorlevel 1 exit /b 1
        config_codec_tests.exe
        if errorlevel 1 exit /b 1
        cl /nologo /EHsc /utf-8 /std:c++20 tests\menu_presentation_tests.cpp /Fe:menu_presentation_tests.exe
        if errorlevel 1 exit /b 1
        menu_presentation_tests.exe
        if errorlevel 1 exit /b 1
        "@ | Set-Content -Path $testScript -Encoding ascii
        & $env:ComSpec /d /c $testScript 2>&1 | Tee-Object -FilePath native-tests-${{ matrix.configuration }}.log
        $testExit = $LASTEXITCODE
        if ($testExit -ne 0) {
          $summary = (Get-Content native-tests-${{ matrix.configuration }}.log -Tail 12) -join ' | '
          Write-Output "::error title=Native calculation tests::$summary"
          exit $testExit
        }

    - name: Build
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      shell: pwsh
      run: |
        msbuild Unibox.sln /m:2 /p:Platform=${{ matrix.platform }} /p:Configuration=${{ matrix.configuration }} /bl:msbuild-${{ matrix.configuration }}.binlog 2>&1 | Tee-Object -FilePath msbuild-${{ matrix.configuration }}.log
        $buildExit = $LASTEXITCODE
        if ($buildExit -ne 0) {
          $errors = Select-String -Path msbuild-${{ matrix.configuration }}.log -Pattern '\berror\s+[A-Z]+\d+' | ForEach-Object { $_.Line } | Sort-Object -Unique | Select-Object -First 40
          foreach ($errorLine in $errors) { Write-Output "::error title=MSBuild::$errorLine" }
          exit $buildExit
        }

    - name: Require the expected DLL
      shell: pwsh
      run: |
        $dll = 'output/${{ matrix.platform }}/${{ matrix.configuration }}/Unibox${{ matrix.platform }}${{ matrix.configuration }}.dll'
        if (!(Test-Path $dll) -or (Get-Item $dll).Length -eq 0) {
          throw "Expected build output missing or empty: $dll"
        }
        python scripts/verify_pe.py $dll
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    
    - uses: actions/upload-artifact@v4
      id: dll
      with:
        name: Unibox${{ matrix.platform }}${{ matrix.configuration }}
        path: output/${{ matrix.platform }}/${{ matrix.configuration }}/*.dll
        if-no-files-found: error
    
    - uses: actions/upload-artifact@v4
      with:
        name: Unibox${{ matrix.platform }}${{ matrix.configuration }}PDB
        path: output/${{ matrix.platform }}/${{ matrix.configuration }}/*.pdb
        if-no-files-found: error

    - name: Upload build diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.configuration }}
        path: |
          msbuild-${{ matrix.configuration }}.binlog
          msbuild-${{ matrix.configuration }}.log
          native-tests-${{ matrix.configuration }}.log
        if-no-files-found: ignore

    - name: Package verified DLL, symbols, notices and local-test instructions
      run: python scripts/package_delivery.py --dll output/${{ matrix.platform }}/${{ matrix.configuration }}/Unibox${{ matrix.platform }}${{ matrix.configuration }}.dll --output artifacts/Amalgam-Ultimate-${{ matrix.configuration }}.zip

    - uses: actions/upload-artifact@v4
      id: candidate
      with:
        name: Amalgam-Ultimate-${{ matrix.configuration }}
        path: artifacts/Amalgam-Ultimate-${{ matrix.configuration }}.zip
        if-no-files-found: error

    - name: Package and validate complete source snapshot
      if: matrix.configuration == 'Release'
      run: python scripts/package_delivery.py --source ${{ github.sha }} --output artifacts/Amalgam-Ultimate-source.zip

    - uses: actions/upload-artifact@v4
      id: source
      if: matrix.configuration == 'Release'
      with:
        name: Amalgam-Ultimate-source
        path: artifacts/Amalgam-Ultimate-source.zip
        if-no-files-found: error

    - name: Record verified delivery links
      shell: pwsh
      run: |
        @"
        ## ${{ matrix.configuration }} x64
        Commit: ${{ github.sha }}
        MSVC v143, Windows Server 2022; native/Python tests, linker and PE32+/AMD64 validation passed.
        - [DLL artifact](${{ steps.dll.outputs.artifact-url }})
        - [DLL, PDB, manifest and documentation](${{ steps.candidate.outputs.artifact-url }})
        - Source artifact (Release job): ${{ steps.source.outputs.artifact-url }}
        TF2 runtime validation has not been performed.
        "@ | Add-Content $env:GITHUB_STEP_SUMMARY
